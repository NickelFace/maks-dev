baseURL = "https://maks.top"
languageCode = "en"
title = "maks.top"
theme = "maks"

[minify]
  minifyOutput = true
[pagination]
  pagerSize = 10

[params]
  author      = "Maks"
  description = "Linux & DevOps Knowledge Base: LPIC-2, AWS, CKA, Networking"
  location    = "Sydney, AU"
  github      = "https://github.com/NickelFace"
  linkedin    = "https://www.linkedin.com/in/lopunov/"
  telegram    = "https://t.me/nickelface"
  email       = ""
  phone       = ""
  og_image    = "/og-default.png"   # default OG image (1200×630px), lives in static/
  home_title  = "Maks Lopunov · Linux & DevOps Knowledge Base"

# ── Russian content is kept in the repo but excluded from the build ──
# The site is English-only in public. Drop this block to bring RU back.
[module]
  [[module.mounts]]
    source       = "content"
    target       = "content"
    excludeFiles = ["**/ru/**"]

[taxonomies]
  tag      = "tags"
  category = "categories"

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML"]
  page    = ["HTML"]

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 6
    ordered    = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      strikethrough = true
  [markup.highlight]
    noClasses   = false
    codeFences  = true
    guessSyntax = false
    lineNos     = false
    tabWidth    = 2
