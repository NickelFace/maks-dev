{{ define "head" }}
<link rel="stylesheet" href="{{ partial "asset.html" "styles/roadmap.css" }}">
{{ end }}

{{ define "main" }}
<main class="rdm-page"
  {{ with .Params.store_key }}data-store-key="{{ . }}"{{ end }}
  {{ with .Params.total }}data-total="{{ . }}"{{ end }}
  {{ with .Params.total_label }}data-total-label="{{ . }}"{{ end }}
  {{ if .Params.default_checked }}data-default-checked="true"{{ end }}>
{{ partial "breadcrumb.html" . }}
{{ .Content }}
</main>
{{ end }}

{{ define "scripts" }}
{{ if .Params.store_key }}<script src="{{ partial "asset.html" "js/roadmap.js" }}" defer></script>{{ end }}
{{ end }}
